name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: POSIX symlink containment
        run: pnpm --filter codedna-vscode exec vitest run src/secure-read.test.ts
      - run: pnpm build
      - run: pnpm verify:web-output
      - run: pnpm --filter codedna-vscode test:worker
      - run: pnpm exec playwright install --with-deps chromium
      - name: Extension Development Host smoke
        run: xvfb-run -a pnpm --filter codedna-vscode test:host
      - run: pnpm --filter codedna-vscode package
      - run: pnpm release:check
      - run: pnpm audit --prod
      - run: pnpm test:e2e
      - name: Smoke test development server
        shell: bash
        run: |
          pnpm dev > /tmp/codedna-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/codedna-dev.log
          exit 1
